<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RealTimeConnect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b14;
            --card: rgba(15, 23, 42, 0.82);
            --border: rgba(255, 255, 255, 0.08);

            --text: #f5f7fb;
            --muted: #8994a8;

            --primary: #6366f1;
            --cyan: #22d3ee;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(99, 102, 241, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(34, 211, 238, 0.10),
                    transparent 30%
                ),
                var(--bg);

            overflow: hidden;
        }


        /* Background decoration */

        .glow {
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.15;

            pointer-events: none;
        }

        .glow-one {
            top: -150px;
            left: -100px;

            background: #6366f1;
        }

        .glow-two {
            right: -120px;
            bottom: -150px;

            background: #22d3ee;
        }


        /* Main card */

        .auth-card {
            width: 100%;
            max-width: 430px;

            padding: 42px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 27, 45, 0.94),
                    rgba(9, 14, 25, 0.94)
                );

            border:
                1px solid var(--border);

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(20px);

            position: relative;
            z-index: 2;
        }


        /* Brand */

        .brand {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 35px;

            font-size: 21px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 8px 28px rgba(99, 102, 241, 0.30);
        }

        .brand-accent {
            color: #818cf8;
        }


        /* Heading */

        .heading {
            text-align: center;

            margin-bottom: 28px;
        }

        .heading h1 {
            font-size: 29px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .heading p {
            color: var(--muted);

            font-size: 13px;
        }


        /* Error */

        .error-message {
            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 10px;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid rgba(239, 68, 68, 0.18);

            color: #fca5a5;

            font-size: 12px;

            text-align: center;
        }


        /* Form */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border-radius: 11px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            background:
                rgba(3, 7, 18, 0.7);

            color: white;

            outline: none;

            font-size: 13px;

            transition: 0.25s ease;
        }

        .form-group input::placeholder {
            color: #566176;
        }

        .form-group input:focus {
            border-color:
                rgba(129, 140, 248, 0.55);

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.09);
        }


        /* Login button */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #4f46e5
                );

            color: white;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.24);

            transition: 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 35px rgba(99, 102, 241, 0.38);
        }

        .login-button:active {
            transform: translateY(0);
        }


        /* Register link */

        .register-text {
            margin-top: 24px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        .register-text a {
            color: #818cf8;

            font-weight: 700;

            text-decoration: none;
        }

        .register-text a:hover {
            color: #a5b4fc;
        }


        /* Security indicator */

        .security {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 6px;

            margin-top: 28px;

            color: #566176;

            font-size: 10px;
        }


        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 18px;
            }

            .auth-card {
                padding: 32px 23px;

                border-radius: 20px;
            }

            .heading h1 {
                font-size: 26px;
            }
        }

    </style>
</head>


<body>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <main class="auth-card">


        <!-- Brand -->

        <div class="brand">

            <div class="brand-icon">
                ◉
            </div>

            <span>
                RealTime<span class="brand-accent">Connect</span>
            </span>

        </div>


        <!-- Heading -->

        <div class="heading">

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to continue to your meetings
            </p>

        </div>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <!-- Login form -->

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Sign In →

            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create one
            </a>

        </p>


        <div class="security">
            🔒 Secure authentication
        </div>


    </main>

</body>

</html>
